# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit is free for public repositories, which this is.
# Docs: https://docs.coderabbit.ai/configure-coderabbit/

language: en-US

tone_instructions: >-
  Be direct and specific. Prefer naming the failure mode and the conditions that
  trigger it over general advice. If a claim is uncertain, say so rather than
  asserting it. Skip praise.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false

  auto_review:
    enabled: true
    drafts: false

  path_filters:
    # Generated or vendored — reviewing these produces noise, not findings.
    - "!mcp/dist/**"
    - "!**/node_modules/**"
    - "!.venv/**"
    - "!**/*.lock"
    - "!mcp/package-lock.json"

  path_instructions:
    - path: "server/**"
      instructions: |
        Async/await throughout, type hints on all signatures, Pydantic models for
        API schemas. Imports grouped stdlib → third-party → local.

        Flag any code that assumes an operation is retryable when it is not.
        sim-bridge commands split into idempotent reads (describe-ui, screenshot,
        probe-point, list) and non-idempotent writes (tap, type, swipe, button,
        home, lock, siri, volume*, applepay). A timeout on a write is ambiguous:
        the command was already written to stdin and may have executed. See #74.

    - path: "server/device/sim_bridge.py"
      instructions: |
        The asyncio.Lock serialising commands is load-bearing, not tidiness. The
        wire protocol carries no request IDs — sim-bridge.swift reads with
        `while let line = readLine()` and replies via `respond()`, and _dispatch
        resolves a single _pending_response future with whatever arrives. Two
        in-flight commands would resolve each other's futures. Removing the
        serialisation requires adding correlation IDs to both sides.

        One SimBridgeManager serves every simulator, so any concurrency budget
        here is server-wide rather than per-device.

        Killing the subprocess when a command times out or is cancelled is
        required, not defensive. The command was already written to stdin, so a
        response may still arrive; releasing the lock without terminating lets
        that late response resolve the NEXT command's future, handing a caller a
        well-formed reply to a request it never made. Flag any change that drops
        the kill, and reject the two remedies that look sufficient and are not:
        clearing `_pending_response` (the next command installs its own future
        before the late response lands) and draining before release (a response
        absent for 30s may never arrive). Only correlation IDs on both sides make
        the kill unnecessary — see #74.

    - path: "mcp/src/tools/**"
      instructions: |
        A tool's `description` is the interface an agent reads to decide whether
        to call it — a stale description is a functional bug, not a docs nit. If
        a change alters what a tool supports (platforms, parameters, return
        shape), check that the description and every parameter `.describe()`
        still match. This has bitten before: scroll_to_element kept saying
        "Android-only" after iOS support shipped, making working functionality
        unreachable through MCP.

    - path: "README.md"
      instructions: |
        The MCP tool table, the endpoint tables and the CLI command block are
        verified against the source by tests/test_readme_sync.py. If a change
        here fails that test, the fix is usually the source of truth, not the
        test.

    - path: "docs/api-reference.md"
      instructions: |
        Generated from the source — every tool with the endpoint behind it,
        derived from each tool's own apiRequest call. Hand-edits get overwritten.
        Changes belong in the generator or the tool definitions.

    - path: "docs/release-channels.md"
      instructions: |
        Fast-forward every channel branch you intend to move BEFORE creating the
        GitHub Release. GitHub permanently refuses to move a branch onto a commit
        that already has a published Release, and this has stranded release/beta
        once already.

    - path: "CHANGELOG.md"
      instructions: |
        Exactly one `## [Unreleased]` heading, and one of each `### Section`
        under it. Add entries to the existing section rather than opening a
        second one — markdownlint MD024 catches the duplicate heading, but not
        the more common cause, which is a merge.

        This is the specific failure mode: two branches each append a `### Fixed`
        block under `## [Unreleased]`, git merges both cleanly because they touch
        different lines, and main ends up with the section twice. It has happened
        twice. When reviewing a branch that adds a changelog section, check
        whether the base already has that section under `## [Unreleased]`.

    - path: "server/device/webinspector.py"
      instructions: |
        `pymobiledevice3>=8.0` is a hard floor with a specific reason:
        `ServiceConnection.send_plist`/`recv_plist` are synchronous in 7.x and
        became coroutines in 8.0.0, so the `await`s here fail against 7.x. Do not
        soften the floor, and do not restate the rationale from memory — it was
        written backwards once and the version boundary was wrong before it was
        checked empirically.

        The `ServiceConnection(sock)` construction deliberately bypasses
        lockdown: this is a simulator, reached through the `webinspectord_sim`
        unix socket, so there is no device to pair with. The import is lazy on
        purpose — "no simulator is booted" is a more useful error than a missing
        dependency, and the socket probing above it needs only the stdlib.

    - path: "server/lifecycle/updater.py"
      instructions: |
        Every step that can fail must propagate that failure to `run_update`'s
        exit code. Reporting a successful update over a half-installed
        environment is worse than reporting the failure, because the user stops
        looking. A helper whose result is ignored is the bug to watch for: this
        file shipped exactly that once, discarding a dependency-install failure
        two lines below a comment describing that same class of bug.

    - path: "server/__main__.py"
      instructions: |
        The mtime stamps (`.venv/.deps-stamp`, `node_modules/.install-stamp`) are
        touched only after the install command succeeds. A stamp written
        unconditionally makes a failed install look complete on every subsequent
        run, which is the failure it exists to prevent.

        Functions called from `quern doctor` must stay read-only unless `--fix`
        was passed. Verify that claim by reading the code path, not by running
        the command — running `quern start` first heals the state and makes a
        broken check look correct.

    - path: "tests/**"
      instructions: |
        pytest with pytest-asyncio. Mock subprocesses — never call real
        simctl/idb/adb in tests.

        Prefer tests that fail rather than hang when the behaviour under test is
        absent: bound anything that waits on an event or a lock. A test that
        blocks forever when a guard is removed is not a working test.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: local
