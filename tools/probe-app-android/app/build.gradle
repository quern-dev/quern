apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.quern.probe"
    compileSdk 34

    defaultConfig {
        applicationId "com.quern.probe"
        // 26 rather than something newer on purpose: Quern's own Android code
        // branches on API level (cert install differs at 34, the keyboard
        // receiver at 34, locale handling at 33), so the fixture is most useful
        // when one APK installs across the whole range we support.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug { applicationIdSuffix "" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
