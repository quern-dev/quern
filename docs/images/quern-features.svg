<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="714" viewBox="0 0 1200 714" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1200" height="714" rx="16" fill="#ffffff"/>
<text x="600.0" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">What Quern does, and the tools it does it with</text>
<text x="600.0" y="80" text-anchor="middle" font-size="15" fill="#475569">One server on your Mac wraps each platform's own tooling behind the same MCP tools and HTTP API</text>
<rect x="80.0" y="112" width="300" height="52" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="230.0" y="134" text-anchor="middle" font-size="16" font-weight="650" fill="#0f172a">Your AI agent</text>
<text x="230.0" y="152" text-anchor="middle" font-size="12.5" fill="#64748b">Claude Code, Cursor, Codex, …</text>
<line x1="388.0" y1="138.0" x2="440.0" y2="138.0" stroke="#94a3b8" stroke-width="2"/>
<path d="M440.0,132.0 L450.0,138.0 L440.0,144.0 Z" fill="#94a3b8"/>
<rect x="450.0" y="112" width="300" height="52" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="600.0" y="134" text-anchor="middle" font-size="16" font-weight="650" fill="#0f172a">Quern MCP tools / HTTP API</text>
<text x="600.0" y="152" text-anchor="middle" font-size="12.5" fill="#64748b">the same calls for every platform</text>
<line x1="758.0" y1="138.0" x2="810.0" y2="138.0" stroke="#94a3b8" stroke-width="2"/>
<path d="M810.0,132.0 L820.0,138.0 L810.0,144.0 Z" fill="#94a3b8"/>
<rect x="820.0" y="112" width="300" height="52" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<text x="970.0" y="134" text-anchor="middle" font-size="16" font-weight="650" fill="#ffffff">Quern server</text>
<text x="970.0" y="152" text-anchor="middle" font-size="12.5" fill="#cbd5e1">on your Mac, localhost:9110</text>
<text x="600.0" y="198" text-anchor="middle" font-size="14" fill="#475569">…which does each job with the platform's own tool:</text>
<text x="52" y="248" font-size="14" font-weight="700" fill="#475569" letter-spacing="0.5">FEATURE</text>
<rect x="290" y="222" width="280" height="40" rx="10" fill="#2563eb"/>
